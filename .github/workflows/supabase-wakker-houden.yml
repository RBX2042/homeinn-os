# Houdt de Supabase-database (gratis plan) wakker. Een project zonder verkeer pauzeert na 7 dagen;
# daarna komen website-leads niet meer in het portaal en gaan de bevestigingsmails niet meer uit.
# Elke 3 dagen één lichte leesvraag via de publieke API (dezelfde publishable sleutel als de
# website gebruikt — die is bedoeld voor de browser; RLS bewaakt de tabel en geeft hier [] terug).
name: Supabase wakker houden
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Database aanspreken
        env:
          KEY: sb_publishable_JZcuyhVWabuo33MZ8qGTDg_wwMth0zC
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            "https://evguvdpuidyvkiinzvys.supabase.co/rest/v1/hios_leads?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          # 540 = project gepauzeerd: laat de workflow falen, dan mailt GitHub de eigenaar.
          [ "$code" = "200" ] || { echo "::error::Supabase antwoordde $code — mogelijk gepauzeerd; herstel via het Supabase-dashboard."; exit 1; }
