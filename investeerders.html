<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeINN — Investeerdersportaal</title>
  <meta name="description" content="Beveiligd portaal voor investeerders van HomeINN: bekijk je inleg, rendement, uitkeringen en projectupdates.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-512.png?v=20260614">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css?v=20260618">
  <style>
    /* Design-tokens komen uit tokens.css (single source of truth). */
    *{box-sizing:border-box}
    body{margin:0;font-family:'Outfit',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:var(--gold)}
    /* Zichtbare gouden focus-ring voor toetsenbordnavigatie */
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--navy);color:#fff;border-bottom:2px solid var(--gold)}
    .topbar .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
    .topbar img{height:30px}
    .topbar .brand span{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.18rem;letter-spacing:.02em}
    .topbar .who{display:flex;align-items:center;gap:14px;font-size:.9rem;color:#dfe5ea}
    main{max-width:920px;margin:0 auto;padding:28px 20px 60px}
    .card{position:relative;background:var(--panel);border:1px solid rgba(12,11,9,.08);border-radius:12px;padding:26px;box-shadow:0 18px 48px rgba(11,30,48,.07);margin-bottom:20px}
    .login-card{max-width:440px;margin:8vh auto 0}
    /* Gouden top-hairline-accent op de hoofdkaarten */
    h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:1.95rem;line-height:1.15;letter-spacing:-.01em;margin:0 0 6px;color:var(--navy)}
    h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.4rem;line-height:1.2;letter-spacing:-.005em;margin:0 0 4px;color:var(--navy)}
    .eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.7rem;color:var(--gold);font-weight:600;margin:0 0 8px}
    .muted{color:var(--muted)}
    label{display:block;font-weight:600;font-size:.85rem;color:var(--navy);margin:14px 0 6px}
    input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;transition:border-color .18s ease,box-shadow .18s ease}
    input[type=email]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.13)}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
    .kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid rgba(12,11,9,.08);border-radius:12px;padding:18px 18px 16px;box-shadow:0 18px 48px rgba(11,30,48,.07)}
    .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
    .kpi span{display:block;text-transform:uppercase;letter-spacing:.14em;font-size:.66rem;font-weight:600;color:var(--muted);margin-bottom:6px}
    .kpi strong{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:2rem;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .progress{height:9px;background:rgba(11,30,48,.08);border-radius:999px;overflow:hidden;margin:10px 0}
    .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
    table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
    th{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--gold)}
    .timeline{list-style:none;margin:0;padding:0}
    .timeline li{padding:8px 0;border-bottom:1px solid var(--line)}
    .timeline .date{font-size:.76rem;color:var(--muted)}
    .empty{color:var(--muted);font-style:italic}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
    .gallery img{width:100%;height:100px;object-fit:cover;border-radius:8px;background:rgba(11,30,48,.06)}
    .contract-doc{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;font-size:.82rem;line-height:1.55;margin:10px 0;color:#222}
    .contract-doc h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.25rem;letter-spacing:-.005em;color:var(--navy);margin:0 0 4px}
    .contract-doc h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1rem;color:var(--navy);margin:12px 0 3px}
    .contract-doc p{margin:0 0 7px}
    .contract-doc img{max-width:110px;height:auto}
    .contract-doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    .contract-doc .doc-sign{display:flex;gap:24px;margin-top:14px}
    .contract-doc .doc-sign .line{border-top:1px solid #999;margin-top:24px;padding-top:3px;color:#777;font-size:.74rem}
    .signname{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;margin-top:4px;transition:border-color .18s ease,box-shadow .18s ease}
    .signname:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.13)}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
    .toast.show{opacity:1}
    .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px}
  </style>
  <link rel="stylesheet" href="portal.css?v=20260620">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="homeinn-public.html"><img src="assets/logo-light.png?v=20260615b" alt="HomeINN"><span>Investeerders</span></a>
    <div class="who" id="who"></div>
  </header>
  <main id="app">
    <div class="card login-card"><p class="muted"><span class="hi-spin"></span>Laden…</p></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="investeerders.js"></script>
</body>
</html>
