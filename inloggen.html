<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeINN — Inloggen</title>
  <meta name="description" content="Log in op het HomeINN-portaal.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-512.png?v=20260614">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root{
      --navy:#0b1e30; --gold:#b49030; --gold-2:#cca94a; --cream:#f5f2ec; --ink:#0c0b09;
      --muted:#6f756f; --line:rgba(12,11,9,.12); --panel:#fffdf8; --red:#b03a3a; --green:#1e6a42;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--navy);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    a{color:var(--gold)}
    .login-card{background:var(--panel);border-radius:18px;max-width:440px;width:100%;padding:34px 30px;
      box-shadow:0 30px 70px rgba(0,0,0,.4)}
    .brand{display:flex;justify-content:center;margin-bottom:18px}
    .brand img{height:48px}
    .eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--gold);font-weight:700;margin:0 0 6px;text-align:center}
    h1{font-size:1.5rem;margin:0 0 6px;color:var(--navy);text-align:center}
    p.intro{color:var(--muted);text-align:center;margin:0 0 18px}
    label{display:block;font-weight:600;font-size:.85rem;color:var(--navy);margin:12px 0 6px}
    input[type=email]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
    .btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px}
    .btn.primary{background:var(--gold);color:#fff}
    .btn.primary:hover{background:var(--gold-2)}
    .btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--line)}
    .muted{color:var(--muted);font-size:.85rem}
    .foot{text-align:center;margin-top:18px;font-size:.8rem}
    .status{text-align:center;color:var(--muted);margin-top:14px;min-height:1.2em}
    .chooser .btn{margin-top:12px}
  </style>
</head>
<body>
  <div class="login-card" id="card">
    <div class="brand"><img src="assets/logo-dark.png?v=20260614" alt="HomeINN"></div>
    <p class="muted" style="text-align:center">Laden…</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="inloggen.js"></script>
</body>
</html>
