<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeINN — Inloggen</title>
  <meta name="description" content="Log in op het HomeINN-portaal.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-512.png?v=20260614">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css?v=20260618">
  <style>
    /* Design-tokens komen uit tokens.css (single source of truth). */
    *{box-sizing:border-box}
    body{margin:0;font-family:'Outfit',system-ui,-apple-system,sans-serif;background:var(--navy);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
    a{color:var(--gold)}
    /* Zichtbare gouden focus-ring voor toetsenbordnavigatie */
    :where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
    .login-card{position:relative;background:var(--cream);border-radius:12px;max-width:440px;width:100%;padding:36px 32px;
      border:1px solid var(--line);box-shadow:0 18px 48px rgba(11,30,48,.07),0 40px 90px rgba(0,0,0,.32);overflow:hidden}
    /* Gouden top-hairline-accent op de kaart */
    .login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
      background:linear-gradient(90deg,var(--gold),var(--gold-2))}
    .brand{display:flex;justify-content:center;margin-bottom:18px}
    .brand img{height:48px}
    .eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.7rem;color:var(--gold);font-weight:600;margin:0 0 8px;text-align:center}
    h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:-.01em;margin:0 0 6px;color:var(--navy);text-align:center}
    p.intro{color:var(--muted);text-align:center;margin:0 0 18px;line-height:1.5}
    label{display:block;font-weight:600;font-size:.8rem;letter-spacing:.01em;color:var(--navy);margin:14px 0 6px}
    input[type=email],input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff;transition:border-color .16s ease,box-shadow .16s ease}
    input[type=email]:focus,input[type=password]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.13)}
    .btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 18px;font:inherit;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px;transition:background-color .16s ease,border-color .16s ease,color .16s ease}
    .btn.primary{background:var(--gold);color:var(--navy);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
    .btn.primary:hover{background:var(--gold-2)}
    .btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--line);font-weight:600}
    .btn.secondary:hover{border-color:var(--gold);color:var(--gold)}
    .muted{color:var(--muted);font-size:.85rem}
    .foot{text-align:center;margin-top:18px;font-size:.8rem}
    .status{text-align:center;color:var(--muted);margin-top:14px;min-height:1.2em}
    .chooser .btn{margin-top:12px}
    @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  </style>
</head>
<body>
  <div class="login-card" id="card">
    <div class="brand"><img src="assets/logo-dark.png?v=20260615b" alt="HomeINN"></div>
    <p class="muted" style="text-align:center">Laden…</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="inloggen.js"></script>
</body>
</html>
