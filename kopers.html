<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeINN — Kopersportaal</title>
  <meta name="description" content="Beveiligd portaal voor kopers van HomeINN: volg je dossier en onderteken je koopovereenkomst.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-512.png?v=20260614">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css?v=20260618">
  <style>
    /* Design-tokens komen uit tokens.css (single source of truth). */
    *{box-sizing:border-box}
    body{margin:0;font-family:'Outfit',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
    a{color:var(--gold)}
    :where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--navy);color:#fff}
    .topbar .brand{display:flex;align-items:center;gap:10px}
    .topbar img{height:30px}
    .topbar .brand span{font-family:var(--serif);font-weight:600;font-size:1.18rem;letter-spacing:.01em;color:var(--gold-2)}
    .topbar .who{display:flex;align-items:center;gap:14px;font-size:.9rem;color:#dfe5ea}
    .btn{border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;transition:background .18s ease,color .18s ease,border-color .18s ease}
    .btn.primary{background:var(--gold);color:var(--navy)}
    .btn.primary:hover{background:var(--gold-2)}
    .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
    .btn.ghost:hover{border-color:var(--gold-2);color:var(--gold-2)}
    .btn.slim{padding:8px 14px;font-size:.74rem}
    main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
    .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:var(--elev);margin-bottom:20px}
    .login-card{max-width:440px;margin:8vh auto 0;overflow:hidden}
    .login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
    h1{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1.12;letter-spacing:-.01em;margin:0 0 6px;color:var(--navy)}
    h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.15;letter-spacing:-.01em;margin:0 0 4px;color:var(--navy)}
    .eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.7rem;color:var(--gold);font-weight:600;margin:0 0 8px}
    .muted{color:var(--muted)}
    label{display:block;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin:14px 0 6px}
    input[type=email],input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--hairline);border-radius:10px;font:inherit;background:#fff;transition:border-color .18s ease,box-shadow .18s ease}
    input[type=email]:focus,input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.13)}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--hairline)}
    th{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
    td.amount,td.num{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.02rem;color:var(--navy)}
    .badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;background:rgba(11,30,48,.07);color:var(--navy)}
    .badge.green{background:rgba(30,106,66,.14);color:var(--green)}
    .badge.gold{background:rgba(var(--gold-rgb),.16);color:var(--gold)}
    .empty{color:var(--muted);font-style:italic}
    .contract-doc{max-height:360px;overflow:auto;border:1px solid var(--hairline);border-radius:10px;padding:16px;background:#fff;font-size:.82rem;line-height:1.55;margin:10px 0;color:#222}
    .contract-doc h1{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--navy);margin:0 0 4px}
    .contract-doc h2{font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--navy);margin:12px 0 3px}
    .contract-doc p{margin:0 0 7px}
    .contract-doc img{max-width:110px;height:auto}
    .contract-doc table{width:100%;border-collapse:collapse}
    .contract-doc .doc-sign{display:flex;gap:24px;margin-top:14px}
    .contract-doc .doc-sign .line{border-top:1px solid #999;margin-top:24px;padding-top:3px;color:#777;font-size:.74rem}
    .signname{width:100%;padding:11px 13px;border:1px solid var(--hairline);border-radius:9px;font:inherit;margin-top:4px;transition:border-color .18s ease,box-shadow .18s ease}
    .signname:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.13)}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
    .toast.show{opacity:1}
    .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="homeinn-public.html"><img src="assets/logo-light.png?v=20260615b" alt="HomeINN"><span>Kopers</span></a>
    <div class="who" id="who"></div>
  </header>
  <main id="app">
    <div class="card login-card"><p class="muted">Laden…</p></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="kopers.js"></script>
</body>
</html>
